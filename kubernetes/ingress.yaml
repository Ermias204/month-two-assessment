apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: muchtodo-ingress
  namespace: muchtodo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: muchtodo.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: muchtodo-backend
            port:
              number: 8080
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: muchtodo-backend
            port:
              number: 8080
      - path: /swagger
        pathType: Prefix
        backend:
          service:
            name: muchtodo-backend
            port:
              number: 8080
