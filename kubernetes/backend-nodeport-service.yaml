apiVersion: v1
kind: Service
metadata:
  name: muchtodo-backend-nodeport
  namespace: muchtodo
  labels:
    app: muchtodo-backend
    component: backend
spec:
  selector:
    app: muchtodo-backend
    component: backend
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  type: NodePort
